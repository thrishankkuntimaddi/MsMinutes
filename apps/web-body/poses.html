<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pose Sheet</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        background: #120a05;
        color: #ffb347;
        font:
          13px/1.2 system-ui,
          sans-serif;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(var(--cell, 240px), 1fr));
        gap: 10px;
      }
      figure {
        margin: 0;
      }
      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        border-radius: 8px;
      }
      figcaption {
        padding: 4px 2px;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/poses.ts"></script>
  </body>
</html>
